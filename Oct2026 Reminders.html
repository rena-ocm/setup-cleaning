<!DOCTYPE html>

<head>

<title>Setup Cleaning — October 2026</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{--bl:#1a3a8f;--gn:#2d6a4f;--pk:#FF69B4;--pu:#7C3AED;--bg:#f0ede8;--br:#d0ccc4;--ink:#1a1a1a;--mu:#666;--rd:#c0392b;--tr:#e67e22}
body{font-family:"Nunito Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding-bottom:80px}
.hdr{background:var(--bl);padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr img{height:38px}.ht{font-family:Nunito,sans-serif;font-weight:800;font-size:16px;color:#fff}
.hs{font-size:11px;color:rgba(255,255,255,.7)}
.tabs{display:flex;background:#122a6e}
.tab{flex:1;padding:10px 4px;color:rgba(255,255,255,.6);cursor:pointer;font-family:Nunito,sans-serif;font-weight:700;font-size:11px;text-align:center;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:#fff}
.pg{display:none}.pg.on{display:block}
.dbar{background:#fff;padding:12px 16px;border-bottom:1px solid var(--br);position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.dlbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700;margin-bottom:8px}
.dscr{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.dscr::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;padding:8px 12px;background:#f0f0f0;border-radius:10px;cursor:pointer;text-align:center;min-width:52px}
.dbtn.on{background:var(--bl);color:#fff}
.dn{font-family:Nunito,sans-serif;font-weight:800;font-size:18px;display:block;line-height:1}
.dd{font-size:10px;opacity:.7;margin-top:2px;display:block}
.wrap{padding:14px}
.empty{text-align:center;padding:60px 20px;color:var(--mu);font-size:15px;line-height:2.4}
.dtitle{font-family:Nunito,sans-serif;font-weight:800;font-size:18px;color:var(--bl);margin-bottom:10px}
.tbar{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tlbl{font-family:Nunito,sans-serif;font-weight:700;font-size:13px;margin-bottom:8px}
.mbtns{display:flex;gap:6px;margin-top:6px}
.mbtn{flex:1;padding:8px 4px;border:2px solid var(--br);border-radius:9px;background:#f5f5f5;font-family:Nunito,sans-serif;font-weight:700;font-size:12px;cursor:pointer;text-align:center;color:var(--mu);transition:all .2s}
.mbtn.on{border-color:var(--bl);background:var(--bl);color:#fff}
.mbtn.ont{border-color:var(--tr);background:var(--tr);color:#fff}
.ibox{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#856404;line-height:1.6}
.tcard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.thdr{padding:12px 16px;color:#fff;font-family:Nunito,sans-serif;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.thdr.pk{background:var(--pk)}.thdr.bl{background:#4DA6FF}.thdr.tr{background:var(--tr)}
.thi{font-size:11px;font-weight:600;opacity:.9}
.crow{padding:12px 14px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:10px}
.crow:last-child{border-bottom:none}.crow.sent{opacity:.35}
.crow.drag-over{background:#eef3ff}.crow.dragging{opacity:.3}
.dh{font-size:18px;color:#bbb;cursor:grab;flex-shrink:0;padding:0 2px;touch-action:none}
.etab{color:#fff;border-radius:8px;padding:5px 9px;font-family:Nunito,sans-serif;font-weight:800;font-size:12px;flex-shrink:0;min-width:72px;text-align:center}
.etab.am{background:var(--bl)}.etab.pm{background:var(--pu)}
.ci{flex:1;min-width:0}.cn{font-weight:600;font-size:14px}
.cd{font-size:10px;color:var(--mu);margin-top:1px}
.cp{font-size:11px;color:var(--mu);margin-top:2px}.cp.no{color:var(--rd)}
.smsa{background:var(--gn);color:#fff;border:none;border-radius:9px;padding:9px 12px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center}
.noph{background:#eee;color:#999;border:none;border-radius:9px;padding:9px 10px;font-size:11px;flex-shrink:0;cursor:pointer}
.rmbtn{background:#fff0f0;color:var(--rd);border:1.5px solid #ffcccc;border-radius:8px;padding:8px 9px;font-size:13px;cursor:pointer;flex-shrink:0}
.bbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--br);padding:12px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.1)}
.nbtn{width:100%;padding:14px;background:var(--bl);color:#fff;border:none;border-radius:12px;font-family:Nunito,sans-serif;font-weight:800;font-size:15px;cursor:pointer}
.nbtn.done{background:var(--gn)}.prg{font-size:11px;color:var(--mu);text-align:center;margin-top:5px}
.wacard{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.wahdr{padding:12px 16px;color:#fff;font-family:Nunito,sans-serif;font-weight:800;font-size:13px}
.wahdr.pk{background:var(--pk)}.wahdr.bl{background:#4DA6FF}.wahdr.tr{background:var(--tr)}
.wabody{padding:16px}
.wamsg{background:#f0f8f0;border:1px solid #c8e6c9;border-radius:10px;padding:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;margin-bottom:10px}
.wacopy{width:100%;padding:11px;background:#25D366;color:#fff;border:none;border-radius:9px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.wacopy.ok{background:var(--gn)}
.scard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
.shdr{background:var(--bl);color:#fff;padding:12px 16px;font-family:Nunito,sans-serif;font-weight:800;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sbdy{display:none;padding:12px 16px}.sbdy.op{display:block}
.smbtns{display:flex;gap:4px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}
.smbtn{flex:1;padding:6px 4px;border:2px solid var(--br);border-radius:8px;background:#f5f5f5;font-family:Nunito,sans-serif;font-weight:700;font-size:11px;cursor:pointer;text-align:center;color:var(--mu)}
.smbtn.on{border-color:var(--bl);background:var(--bl);color:#fff}
.smbtn.ont{border-color:var(--tr);background:var(--tr);color:#fff}
.slbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;padding:6px 10px;border-radius:6px;color:#fff}
.slbl.pk{background:var(--pk)}.slbl.bl{background:#4DA6FF}.slbl.tr{background:var(--tr)}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#f8f8f8;border-radius:8px;padding:8px 10px}
.srow.drag-over{background:#ddeeff}.srow.dragging{opacity:.3}
.sdh{color:#bbb;font-size:16px;flex-shrink:0;cursor:grab;touch-action:none}
.scn{flex:1;font-weight:600;font-size:13px}
.sdur{width:62px;padding:6px 8px;border:1.5px solid var(--br);border-radius:6px;font-size:13px;outline:none;text-align:center}
.sdur:focus{border-color:var(--tr)}
.seta{width:76px;padding:6px 8px;background:#e8f4fd;border-radius:6px;font-size:12px;font-family:Nunito,sans-serif;font-weight:700;color:var(--bl);text-align:center}
.srm{background:none;border:none;color:var(--rd);font-size:16px;cursor:pointer;padding:2px 4px}
.sadd{display:flex;gap:8px;margin-top:8px}
.saname{flex:1;padding:7px 10px;border:1.5px dashed var(--br);border-radius:7px;font-size:13px;outline:none}
.sadur{width:65px;padding:7px 8px;border:1.5px dashed var(--br);border-radius:7px;font-size:13px;text-align:center;outline:none}
.saddbtn{background:var(--gn);color:#fff;border:none;border-radius:7px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.recalc{width:100%;margin-top:10px;padding:10px;background:var(--bl);color:#fff;border:none;border-radius:8px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.ccard{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:14px}
.ctitle{font-family:Nunito,sans-serif;font-weight:800;font-size:15px;color:var(--bl);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.addbtn{background:var(--gn);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-family:Nunito,sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.conrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5}
.conrow:last-child{border-bottom:none}
.coname{flex:1;font-weight:600;font-size:14px}.coph{font-size:12px;color:var(--mu)}.coph.no{color:var(--rd)}
.ebtn{background:var(--bl);color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
.dbtn2{background:var(--rd);color:#fff;border:none;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;cursor:pointer}
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.mo.on{display:flex}
.md{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:400px}
.mdtitle{font-family:Nunito,sans-serif;font-weight:800;font-size:16px;color:var(--bl);margin-bottom:16px}
.md label{font-size:11px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;margin-top:12px}
.md input{width:100%;padding:10px;border:1.5px solid var(--br);border-radius:8px;font-size:14px;outline:none}
.md input:focus{border-color:var(--bl)}
.mdbtns{display:flex;gap:8px;margin-top:18px}
.mdbtns button{flex:1;padding:12px;border:none;border-radius:9px;font-family:Nunito,sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.mdsave{background:var(--gn);color:#fff}.mdcan{background:#f0f0f0;color:var(--mu)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a3a8f;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;display:none;white-space:nowrap}
.toast.on{display:block}

.etab.tbd{background:var(--tr)}
.md select{width:100%;padding:10px;border:1.5px solid var(--br);border-radius:8px;font-size:14px;outline:none;background:#fff;font-family:"Nunito Sans",sans-serif}
.md select:focus{border-color:var(--bl)}
.pcard{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-left:4px solid var(--gn)}
.pname{font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:var(--bl);margin-bottom:4px}
.pnote{font-size:12px;color:var(--mu);line-height:1.6;margin-bottom:10px}
.pbtn{background:var(--gn);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-family:Nunito,sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.cfmcard{background:#fff8e6;border:1px solid #ffe4a3;border-radius:12px;padding:14px 16px;margin-bottom:12px}
.cfmname{font-family:Nunito,sans-serif;font-weight:800;font-size:13px;color:#8a5a00;margin-bottom:4px}
.cfmnote{font-size:12px;color:#6b5000;line-height:1.6;margin-bottom:10px}
.cfmbtn{background:none;border:1.5px solid #d4a017;color:#8a5a00;border-radius:8px;padding:7px 12px;font-family:Nunito,sans-serif;font-weight:700;font-size:11px;cursor:pointer}
.sectlbl{font-family:Nunito,sans-serif;font-weight:800;font-size:13px;color:var(--bl);margin:4px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.crow.dragging{opacity:.35}
.crow{touch-action:pan-y}
.srow{touch-action:pan-y}
.emptysm{text-align:center;padding:24px 10px;color:var(--mu);font-size:13px}
.toast.err{background:var(--rd)}


/* ---- wider tab bar (7 tabs) ---- */
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:76px;padding:10px 8px}
.tname{font:inherit;color:inherit;background:transparent;border:none;border-bottom:1px dashed currentColor;width:65%;outline:none}

/* ---- employees tab ---- */
.emprow{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.emprow.gas{align-items:center;justify-content:space-between;flex-wrap:nowrap}
.emprow.gas label{font-size:12px;color:var(--mu);font-weight:600}
.emprow.gas input{width:80px;padding:8px;border:1.5px solid var(--br);border-radius:8px;font-size:14px;text-align:right}
.empname{font-family:Nunito,sans-serif;font-weight:800;font-size:14px;color:var(--bl);width:100%}
.empr{font-size:11px;color:var(--mu);background:var(--bg);border-radius:6px;padding:3px 8px}
.emprow .ebtn,.emprow .dbtn2{margin-left:auto}

/* ---- purchase orders tab ---- */
.pobar{background:#fff;padding:10px 16px;border-bottom:1px solid var(--br);display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:40}
.pobar label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:700}
.pobar select{flex:1;padding:8px 6px;border:1.5px solid var(--br);border-radius:8px;font-size:12px;background:#fff}
.pocard{background:#fff;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.pohdr{background:var(--bl);color:#fff;padding:10px 14px;font-family:Nunito,sans-serif;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pototal{font-family:Nunito,sans-serif;font-weight:800}
.porow{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bg)}
.pod{font-size:11px;color:var(--mu);width:64px;flex-shrink:0}
.pohrs{width:52px;padding:6px;border:1.5px solid var(--br);border-radius:7px;font-size:12px;text-align:center}
.porole{flex:1;padding:6px 4px;border:1.5px solid var(--br);border-radius:7px;font-size:11px;background:#fff;min-width:0}
.popay{font-family:Nunito,sans-serif;font-weight:800;font-size:12px;color:var(--gn);width:56px;text-align:right;flex-shrink:0}
.popay.zero{color:var(--rd)}
.pocopy{width:100%;background:var(--gn);color:#fff;border:none;padding:11px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.addadhoc{width:100%;background:none;border:1.5px dashed var(--br);color:var(--mu);border-radius:10px;padding:12px;font-family:Nunito,sans-serif;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:20px}
.pomargin{color:#8a5a00;background:#fff8e6;border:1px solid #ffe4a3;border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.6;margin-bottom:12px}

</style>
</head>

    <label>De</label><select id="po-start" onchange="changePeriodStart(this.value)"></select>
    <label>at&eacute;</label><select id="po-end" onchange="changePeriodEnd(this.value)"></select>
  </div>
  <div class="wrap" id="po-wrap"></div>
</div>
<div class="bbar" id="bbar" style="display:none">
  <button class="nbtn" id="nbtn" onclick="nextSMS()">Send Next SMS</button>
  <div class="prg" id="prg"></div>
</div>
<div class="mo" id="cfm-mo"><div class="md">
  <div class="mdtitle">Confirmar</div>
  <p id="cfm-msg" style="color:#444;font-size:14px;margin-bottom:4px;"></p>
  <div class="mdbtns"><button class="mdcan" onclick="cfmNo()">Cancelar</button><button class="mdsave" style="background:var(--rd)" onclick="cfmYes()">Sim, remover</button></div>
</div></div>
<div class="mo" id="modal"><div class="md">
  <div class="mdtitle" id="mdtitle">Add Contact</div>
  <label>Name</label><input id="mname" placeholder="Client name">
  <label>Phone</label><input id="mphone" type="tel" placeholder="0400 000 000">
  <div class="mdbtns"><button class="mdcan" onclick="closeMod()">Cancel</button><button class="mdsave" onclick="saveCon()">Save</button></div>
</div></div>
<div class="mo" id="sched-mo"><div class="md">
  <div class="mdtitle" id="sched-title">Agendar</div>
  <label>Dia</label><select id="sched-date"></select>
  <label>Equipe</label><select id="sched-team"></select>
  <label>Dura&ccedil;&atilde;o (horas)</label><input id="sched-dur" type="number" step="0.25" min="0" value="1.5">
  <div class="mdbtns"><button class="mdcan" onclick="closeSchedMod()">Cancel</button><button class="mdsave" onclick="saveSchedulePick()">Agendar</button></div>
</div></div>
<div class="mo" id="emp-mo"><div class="md">
  <div class="mdtitle" id="emtitle">Novo Funcion&aacute;rio</div>
  <label>Nome</label><input id="emname" placeholder="Nome do funcion&aacute;rio">
  <label>Cleaner ($/h)</label><input id="emcleaner" type="number" step="0.5" min="0" value="0">
  <label>Driver — carro da empresa ($/h)</label><input id="emdco" type="number" step="0.5" min="0" value="0">
  <label>Driver — carro pr&oacute;prio ($/h, + gasolina)</label><input id="emdown" type="number" step="0.5" min="0" value="0">
  <div class="mdbtns"><button class="mdcan" onclick="closeEmpMod()">Cancel</button><button class="mdsave" onclick="saveEmp()">Save</button></div>
</div></div>
<div class="mo" id="adhoc-mo"><div class="md">
  <div class="mdtitle">Ajuste manual (PO)</div>
  <label>Nome do funcion&aacute;rio</label><input id="adname" placeholder="Nome">
  <label>Dia do m&ecirc;s (ex: 05)</label><input id="addate" placeholder="05">
  <label>Horas</label><input id="adhrs" type="number" step="0.25" min="0" value="1">
  <label>Fun&ccedil;&atilde;o</label>
  <select id="adrole"><option value="cleaner">Cleaner</option><option value="driverCo">Driver (company car)</option><option value="driverOwn">Driver (own car)</option></select>
  <label>Nota (opcional)</label><input id="adnote" placeholder="ex: cobriu turno de X">
  <div class="mdbtns"><button class="mdcan" onclick="closeAdhocMod()">Cancel</button><button class="mdsave" onclick="saveAdhoc()">Add</button></div>
</div></div>

function dayKey(d){ return d.month + d.date; }
function findDay(key){ return SS.find(function(d){ return dayKey(d) === key; }); }
function pad2(n){ return (n<10?'0':'')+n; }

function normName(s){
  return String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/\+.*/,'').replace(/see sms requests/gi,'').trim();
}
function cleanPhone(ph){
  return String(ph||'').replace(/[^\d+]/g,'');
}
function phoneFor(name){
  var n = normName(name);
  if(!n) return '';
  for(var i=0;i<SC.length;i++){
    var cn = normName(SC[i].name);
    if(cn===n) return SC[i].phone||'';
  }
  for(var i=0;i<SC.length;i++){
    var cn = normName(SC[i].name);
    if(cn && (n.indexOf(cn)>-1 || cn.indexOf(n)>-1)) return SC[i].phone||'';
  }
  return '';
}
function contactIdxFor(name){
  var n = normName(name);
  for(var i=0;i<SC.length;i++){ if(normName(SC[i].name)===n) return i; }
  return -1;
}

function isIOS(){
  return /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function smsHref(phone, msg){
  var p = cleanPhone(phone);
  var sep = isIOS() ? '&' : '?';
  return 'sms:'+p+sep+'body='+encodeURIComponent(msg);
}
function copyToClipboard(text, cb){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ if(cb) cb(); }, function(){ fallbackCopy(text, cb); });
  } else {
    fallbackCopy(text, cb);
  }
}

function etaClass(eta){
  if(!eta) return 'tbd';
  if(/AM/.test(eta)) return 'am';
  if(/PM/.test(eta)) return 'pm';
  return 'tbd';
}
function etaShort(eta){
  if(!eta) return 'TBD';
  return eta;
}

function decToClock(decHour){
  var totalMin = Math.round(decHour*60);
  var h = Math.floor(totalMin/60);
  var m = totalMin%60;
  var ap = h<12?'AM':'PM';
  var h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad2(m)+' '+ap;
}
function recalcTeam(list){

  }
}

function fmtDur(h){
  var hh = Math.floor(h);
  var mm = Math.round((h-hh)*60);
  if(hh===0) return mm+'min';
  if(mm===0) return hh+'h';
  return hh+'h'+pad2(mm)+'min';
}

/* ---------- persistence ----------
   State lives in a separate JSON file (data/state.json) inside the artifact's
   own file store, published via the files-form of artifact.publish. index.html
   itself never changes after the first publish — only that data file does. */
var LS_KEY = 'scs_'+MONTH_ID+'_state_v1';
function stateSnapshot(){
  return {SS:SS, SC:SC, SENT:SENT, PENDING:PENDING, CONFIRM:CONFIRM,
          EMP:EMP, GAS_FLAT:GAS_FLAT, POOVR:POOVR, POADHOC:POADHOC, PERIOD:PERIOD};
}
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(stateSnapshot()));
    return true;
  }catch(e){ return false; }
}
function loadLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    var j = JSON.parse(raw);
    return (j && j.SS) ? j : null;
  }catch(e){ return null; }
}
/* scheduleSave() is called after every edit. The on-device save (localStorage)
   always happens IMMEDIATELY and synchronously, in the same tick as the edit —
   never delayed — because a delayed save can be lost if the page is closed or
   backgrounded a moment later (e.g. right after deleting a client). Only the
   optional cloud sync (ART.publish, for viewers where claude.ai granted write
   access) is debounced, since that one is a network call and just a bonus. */
function scheduleSave(){
  var localOk = saveLocal();
  if(!localOk) showToast('Não foi possível salvar neste dispositivo.', true);
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(syncRemote, 400);
}
async function syncRemote(){
  if(!ART) return;
  try{
    await ART.publish({'data/state.json': JSON.stringify(stateSnapshot())});
  }catch(e){
    /* conflict / not_writer / not_granted / capability_disabled and similar:
       the on-device save from scheduleSave() already covers this device, so
       stay quiet — this is just the optional cross-device sync failing. */
  }
}
async function loadState(){
  var fromServer = null;
  try{
    var res = await fetch('data/state.json', {cache:'no-store'});
    if(res.ok){
      var j = await res.json();
      if(j && j.SS) fromServer = j;
    }
  }catch(e){ /* not reachable from this view (e.g. standalone/home-screen) */ }
  var fromLocal = loadLocal();
  var chosen = fromServer || fromLocal;
  if(chosen){
    SS = chosen.SS; SC = chosen.SC || []; SENT = chosen.SENT || {}; PENDING = chosen.PENDING || []; CONFIRM = chosen.CONFIRM || [];
    EMP = chosen.EMP || DEFAULT_EMP;
    GAS_FLAT = (chosen.GAS_FLAT!=null) ? chosen.GAS_FLAT : DEFAULT_GAS_FLAT;
    POOVR = chosen.POOVR || {};
    POADHOC = chosen.POADHOC || [];
    PERIOD = chosen.PERIOD || defaultPeriod();
    return;
  }
  SS = DEFAULT_SS; SC = DEFAULT_SC; SENT = {}; PENDING = DEFAULT_PENDING; CONFIRM = DEFAULT_CONFIRM;
  EMP = DEFAULT_EMP; GAS_FLAT = DEFAULT_GAS_FLAT; POOVR = {}; POADHOC = [];
  PERIOD = defaultPeriod();
}
function defaultPeriod(){
  var days = SS.map(function(d){return d;}).sort(function(a,b){ return parseInt(a.date)-parseInt(b.date); });
  if(!days.length) return {start:'', end:''};
  var startNum = parseInt(days[0].date);
  var endTarget = startNum + 13; // 14 calendar days = a standard quinzena
  var candidates = days.filter(function(d){ return parseInt(d.date) <= endTarget; });
  var end = candidates.length ? candidates[candidates.length-1] : days[days.length-1];
  return {start: days[0].date, end: end.date};
}

function sentKey(dateKey, teamIdx, name, idx){ return dateKey+'|'+teamIdx+'|'+idx+'|'+name; }

function renderReminders(){
  var wrap = document.getElementById('rem-wrap');
  var d = findDay(DATE_KEY);
  if(!d){ wrap.innerHTML = '<div class="empty">&#128197;<br>Select a date above</div>'; updateProgress(); return; }

  var html = '';
  teams.forEach(function(team, ti){
    if(!team.list.length) return;
    html += '<div class="tcard"><div class="thdr '+team.cls+'"><span>'+team.label+' &middot; '+esc(team.name)+'</span><span class="thi">'+team.list.length+' clientes</span></div>';
    team.list.forEach(function(c, ci){
      var key = sentKey(DATE_KEY, ti, c.name, ci);
      var sent = !!SENT[key];
      var ph = phoneFor(c.name);
      var msg = smsMessage(d, c, team);
      html += '<div class="crow'+(sent?' sent':'')+'" data-key="'+esc(key)+'">';
      html += '<span class="dh">&#9776;</span>';
      html += '<span class="etab '+etaClass(c.eta_ampm)+'">'+esc(etaShort(c.eta_ampm))+'</span>';
      html += '<div class="ci"><div class="cn">'+esc(c.name)+'</div><div class="cd">'+fmtDur(c.dur)+'</div>';

      if(ph){
        html += '<a class="smsa" data-msg="'+esc(msg)+'" href="'+smsHref(ph,msg)+'" onclick="smsTap(event,\''+escJs(key)+'\')">&#128172; SMS</a>';
      } else {

      }
      html += '<button class="rmbtn" onclick="confirmRemove('+ti+','+ci+')">&#10005;</button>';

    });
    html += '</div>';
  });
  wrap.innerHTML = html || '<div class="empty">&#128197;<br>Nenhum cliente neste dia</div>';

function smsMessage(day, client, team){
  var time = /^\d{1,2}:\d{2} (AM|PM)$/.test(client.eta_ampm||'') ? client.eta_ampm : 'the scheduled time';
  return 'Dear customer,\n\n'+
    'Just a friendly reminder that your house cleaning is scheduled for tomorrow around '+time+'.\n\n'+
    'If you won\'t be home, please ensure we have access to the property by leaving a key in a safe place and letting us know where it is, or by providing a key copy if you haven\'t already done so.\n\n'+
    'Kind regards,\nRenata\nSetup Cleaning Services';
}
function markSent(key){
  SENT[key] = !SENT[key];
  scheduleSave(); /* saves to this device immediately, synchronously */
  /* Deferred: the SMS row is a real <a href="sms:..."> link, and this handler
     runs on the same click. Re-rendering rem-wrap synchronously here replaces
     (destroys) that very <a> element before the browser can act on its href,
     which silently cancels the handoff to the Messages app. Yielding to the
     next tick lets the native navigation fire first. */
  setTimeout(function(){
    renderReminders();
  }, 0);
}
function smsTap(ev, key){
  /* Belt-and-suspenders for the SMS button: copy the message to the
     clipboard synchronously (works everywhere, no permissions surprises
     since it runs inside the tap gesture) so the text is always available
     to paste even if the phone/browser doesn't hand off to Messages via
     the sms: link — some browsers or in-app views block or ignore that. */
  var el = ev.currentTarget;
  var msg = el.getAttribute('data-msg') || '';
  copyToClipboard(msg, function(){});
  markSent(key);
}
function updateProgress(){
  var d = findDay(DATE_KEY);
  var bar = document.getElementById('bbar');
  if(!d){ return; }
  var all = [];
  var teams = d.is_trio ? [d.t1] : [d.t1, d.t2];
  teams.forEach(function(list, ti){ list.forEach(function(c, ci){ all.push(sentKey(DATE_KEY, ti, c.name, ci)); }); });
  var sentCount = all.filter(function(k){ return SENT[k]; }).length;
  var prg = document.getElementById('prg');
  var btn = document.getElementById('nbtn');
  if(all.length===0){ prg.textContent=''; btn.textContent='Send Next SMS'; btn.className='nbtn'; return; }
  prg.textContent = sentCount+' de '+all.length+' enviados';
  if(sentCount>=all.length){ btn.textContent='Tudo enviado ✓'; btn.className='nbtn done'; }
  else { btn.textContent='Send Next SMS'; btn.className='nbtn'; }
}
function nextSMS(){
  var d = findDay(DATE_KEY);
  if(!d) return;
  var teams = d.is_trio ? [{list:d.t1, name:d.team1_name}] : [{list:d.t1, name:d.team1_name}, {list:d.t2, name:d.team2_name}];
  for(var ti=0; ti<teams.length; ti++){
    var list = teams[ti].list;
    for(var ci=0; ci<list.length; ci++){
      var key = sentKey(DATE_KEY, ti, list[ci].name, ci);
      if(!SENT[key]){
        var ph = phoneFor(list[ci].name);
        var msg = smsMessage(d, list[ci], teams[ti]);
        SENT[key] = true;
        scheduleSave(); /* saves to this device immediately, synchronously */
        if(ph){
          copyToClipboard(msg, function(){});
          var href = smsHref(ph, msg);
          setTimeout(function(){ window.location.href = href; }, 0);
        } else {
          showToast(list[ci].name+' não tem telefone cadastrado.', true);
        }
        setTimeout(function(){ renderReminders(); }, 0);
        return;
      }
    }
  }
  showToast('Todos os lembretes de hoje já foram enviados!');
}

function waTeamLabel(team){

  if(team.cls==='bl') return 'Team Blue';
  if(team.label==='SOLO') return team.name;
  return 'Team Orange'; // Friday trio

function waMessage(day, team){
  var lines = ['Hi '+waTeamLabel(team)+', thank you for today. For '+day.day_name+':', ''];
  team.list.forEach(function(c, i){
    lines.push((i+1)+'. '+etaShort(c.eta_ampm)+' — '+c.name+' ('+fmtDur(c.dur)+')');
  });
  var total = team.list.reduce(function(s,c){ return s+(parseFloat(c.dur)||0); }, 0);
  lines.push('');

function copyMsg(ti){
  var el = document.getElementById('wamsg-'+ti);
  var text = el.textContent;
  var btn = document.getElementById('cp-'+ti);
  function done(){
    var old = btn.textContent;
    btn.textContent = '✓ Copiado!';
    btn.classList.add('ok');
    setTimeout(function(){ btn.textContent = old; btn.classList.remove('ok'); }, 1800);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

/* ---------- purchase orders (POs) tab ---------- */
function empNamesForTeam(s){
  return String(s||'').split('/').map(function(x){ return x.trim(); }).filter(function(x){ return x && x!=='?'; });
}
function findEmp(name){
  var n = String(name||'').toLowerCase();
  for(var i=0;i<EMP.length;i++){ if(EMP[i].name.toLowerCase()===n) return EMP[i]; }
  return null;
}
function dayRoster(d){
  var hoursBy = {}, order = [];
  function add(teamName, list){
    var h = (list||[]).reduce(function(s,c){ return s+(parseFloat(c.dur)||0); }, 0);
    empNamesForTeam(teamName).forEach(function(n){
      if(!(n in hoursBy)){ hoursBy[n]=0; order.push(n); }
      hoursBy[n] += h;
    });
  }
  add(d.team1_name, d.t1);
  if(!d.is_trio) add(d.team2_name, d.t2);
  return order.map(function(n){ return {name:n, hours:hoursBy[n]}; });
}
function defaultRoleFor(emp){
  if(!emp) return 'cleaner';
  if(parseFloat(emp.driverCo)>0) return 'driverCo';
  if(parseFloat(emp.driverOwn)>0) return 'driverOwn';
  return 'cleaner';
}
function rateFor(emp, role){
  if(!emp) return 0;
  if(role==='cleaner') return parseFloat(emp.cleaner)||0;
  if(role==='driverCo') return parseFloat(emp.driverCo)||0;
  if(role==='driverOwn') return parseFloat(emp.driverOwn)||0;
  return 0;
}
function roleLabel(role){
  if(role==='driverCo') return 'Driver (company car)';
  if(role==='driverOwn') return 'Driver (own car)';
  return 'Cleaner';
}
function povKey(dateKey, name){ return dateKey+'|'+name; }
function sortedSSDates(){
  return SS.map(function(d){ return d; }).sort(function(a,b){ return parseInt(a.date)-parseInt(b.date); });
}
function periodDays(){
  if(!PERIOD.start || !PERIOD.end) return [];
  var s = parseInt(PERIOD.start), e = parseInt(PERIOD.end);
  return sortedSSDates().filter(function(d){ var v=parseInt(d.date); return v>=s && v<=e; });
}
function buildPORows(){
  var days = periodDays();
  var byEmp = {};
  days.forEach(function(d){
    var dk = dayKey(d);
    dayRoster(d).forEach(function(r){
      var emp = findEmp(r.name);
      var key = povKey(dk, r.name);
      var ov = POOVR[key] || {};
      if(ov.excluded) return;
      var hours = (ov.hours!=null) ? ov.hours : r.hours;
      var role = ov.role || defaultRoleFor(emp);
      var rate = rateFor(emp, role);
      var gas = role==='driverOwn' ? (parseFloat(GAS_FLAT)||0) : 0;
      var pay = hours*rate + gas;
      if(!byEmp[r.name]) byEmp[r.name] = {name:r.name, rows:[], total:0};
      byEmp[r.name].rows.push({sortKey:dk, date:d.date, day_name:d.day_name, hours:hours, role:role, rate:rate, gas:gas, pay:pay, key:key, adhoc:false});
      byEmp[r.name].total += pay;
    });
  });
  POADHOC.forEach(function(a, ai){
    var dv = parseInt(a.date);
    if(isNaN(dv) || dv<parseInt(PERIOD.start) || dv>parseInt(PERIOD.end)) return;
    var emp = findEmp(a.name);
    var rate = rateFor(emp, a.role);
    var gas = a.role==='driverOwn' ? (parseFloat(GAS_FLAT)||0) : 0;
    var pay = (parseFloat(a.hours)||0)*rate + gas;
    if(!byEmp[a.name]) byEmp[a.name] = {name:a.name, rows:[], total:0};
    byEmp[a.name].rows.push({sortKey:'9'+a.date, date:a.date, day_name:a.note||'Ajuste manual', hours:a.hours, role:a.role, rate:rate, gas:gas, pay:pay, adhocIdx:ai, adhoc:true});
    byEmp[a.name].total += pay;
  });
  return byEmp;
}
function renderPOs(){
  var wrap = document.getElementById('po-wrap');
  var days = sortedSSDates();
  var ssel = document.getElementById('po-start'), esel = document.getElementById('po-end');
  if(days.length){
    var opts = days.map(function(d){ return '<option value="'+d.date+'">'+d.day_name.slice(0,3)+' '+d.date+'/'+MM+'</option>'; }).join('');
    ssel.innerHTML = opts; esel.innerHTML = opts;
    ssel.value = PERIOD.start; esel.value = PERIOD.end;
  }
  var byEmp = buildPORows();
  var names = Object.keys(byEmp).sort();
  var html = '<div class="pomargin">Cada linha vem da agenda (horas do time naquele dia). Ajuste horas/função se precisar, ou remova uma linha sem afetar a agenda. Valor em vermelho = funcionário sem taxa cadastrada (aba Rates). Use "+ Ajuste manual" para lançar algo fora da agenda.</div>';
  if(names.length===0){ html += '<div class="empty">&#128203;<br>Nenhuma hora neste período</div>'; }
  names.forEach(function(name){
    var g = byEmp[name];
    g.rows.sort(function(a,b){ return (a.sortKey||'').localeCompare(b.sortKey||''); });
    html += '<div class="pocard"><div class="pohdr"><span>'+esc(name)+'</span><span class="pototal">$'+g.total.toFixed(2)+'</span></div>';
    g.rows.forEach(function(r){
      html += '<div class="porow">';
      html += '<div class="pod">'+esc(String(r.day_name).slice(0,3))+' '+esc(r.date)+'/'+MM+'</div>';
      if(r.adhoc){
        html += '<input class="pohrs" type="number" step="0.25" value="'+r.hours+'" onchange="changeAdhocHours('+r.adhocIdx+',this.value)">';
        html += '<select class="porole" onchange="changeAdhocRole('+r.adhocIdx+',this.value)">';
      } else {
        html += '<input class="pohrs" type="number" step="0.25" value="'+(Math.round(r.hours*100)/100)+'" onchange="changePORowHours(\''+escJs(r.key)+'\',this.value)">';
        html += '<select class="porole" onchange="changePORowRole(\''+escJs(r.key)+'\',this.value)">';
      }
      ['cleaner','driverCo','driverOwn'].forEach(function(rl){
        html += '<option value="'+rl+'"'+(r.role===rl?' selected':'')+'>'+roleLabel(rl)+'</option>';
      });
      html += '</select>';
      html += '<div class="popay'+(r.rate===0?' zero':'')+'">$'+r.pay.toFixed(2)+'</div>';
      if(r.adhoc){ html += '<button class="rmbtn" onclick="removeAdhoc('+r.adhocIdx+')">&#10005;</button>'; }
      else { html += '<button class="rmbtn" onclick="excludePORow(\''+escJs(r.key)+'\')" title="Remover deste PO">&#10005;</button>'; }
      html += '</div>';
    });
    html += '<button class="pocopy" onclick="copyPO(\''+escJs(name)+'\')">&#128172; Copiar PO</button></div>';
  });
  html += '<button class="addadhoc" onclick="openAdhocMod()">+ Ajuste manual</button>';
  wrap.innerHTML = html;
}
function changePeriodStart(v){ PERIOD.start=v; renderPOs(); scheduleSave(); }
function changePeriodEnd(v){ PERIOD.end=v; renderPOs(); scheduleSave(); }
function changePORowHours(key, val){
  POOVR[key] = POOVR[key] || {};
  POOVR[key].hours = parseFloat(val)||0;
  renderPOs();
  scheduleSave();
}
function changePORowRole(key, val){
  POOVR[key] = POOVR[key] || {};
  POOVR[key].role = val;
  renderPOs();
  scheduleSave();
}
function excludePORow(key){
  openConfirm('Remover esta linha deste PO? (não altera a agenda)', function(){
    POOVR[key] = POOVR[key] || {};
    POOVR[key].excluded = true;
    renderPOs();
    scheduleSave();
    showToast('Linha removida do PO.');
  });
}
function openAdhocMod(){
  document.getElementById('adname').value = '';
  document.getElementById('addate').value = PERIOD.start || '01';
  document.getElementById('adhrs').value = 1;
  document.getElementById('adrole').value = 'cleaner';
  document.getElementById('adnote').value = '';
  document.getElementById('adhoc-mo').classList.add('on');
}
function closeAdhocMod(){ document.getElementById('adhoc-mo').classList.remove('on'); }
function saveAdhoc(){
  var name = document.getElementById('adname').value.trim();
  if(!name){ showToast('Digite o nome.', true); return; }
  var date = document.getElementById('addate').value.trim();
  var hours = parseFloat(document.getElementById('adhrs').value)||0;
  var role = document.getElementById('adrole').value;
  var note = document.getElementById('adnote').value.trim();
  POADHOC.push({name:name, date:date, hours:hours, role:role, note:note});
  closeAdhocMod();
  renderPOs();
  scheduleSave();
  showToast('Ajuste adicionado.');
}
function changeAdhocHours(idx, val){ POADHOC[idx].hours = parseFloat(val)||0; renderPOs(); scheduleSave(); }
function changeAdhocRole(idx, val){ POADHOC[idx].role = val; renderPOs(); scheduleSave(); }
function removeAdhoc(idx){
  openConfirm('Remover este ajuste manual?', function(){
    POADHOC.splice(idx,1);
    renderPOs();
    scheduleSave();
  });
}
function copyPO(name){
  var byEmp = buildPORows();
  var g = byEmp[name];
  if(!g){ showToast('Sem horas neste período.', true); return; }
  g.rows.sort(function(a,b){ return (a.sortKey||'').localeCompare(b.sortKey||''); });
  var lines = ['Purchase Order — '+name, 'Setup Cleaning Services', 'Período: '+PERIOD.start+'/'+MM+' – '+PERIOD.end+'/'+MM+'/2026', ''];
  g.rows.forEach(function(r){
    var line = String(r.day_name).slice(0,3)+' '+r.date+'/'+MM+' — '+fmtDur(parseFloat(r.hours)||0)+' — '+roleLabel(r.role)+' ($'+r.rate.toFixed(2)+'/h)';
    if(r.gas>0) line += ' + $'+r.gas.toFixed(2)+' gas';
    line += ' = $'+r.pay.toFixed(2);
    lines.push(line);
  });
  lines.push('');
  lines.push('TOTAL: $'+g.total.toFixed(2));
  copyToClipboard(lines.join('\n'), function(){ showToast('PO de '+name+' copiado!'); });
}

/* ---------- generic confirm modal ---------- */
function openConfirm(msg, cb){
  document.getElementById('cfm-msg').textContent = msg;
  CONFIRM_CB = cb;
  document.getElementById('cfm-mo').classList.add('on');
}
function cfmYes(){ document.getElementById('cfm-mo').classList.remove('on'); if(CONFIRM_CB) CONFIRM_CB(); CONFIRM_CB=null; }
function cfmNo(){ document.getElementById('cfm-mo').classList.remove('on'); CONFIRM_CB=null; }

/* ---------- reset ---------- */
function resetAll(){
  openConfirm('Resetar todos os lembretes marcados como enviados este mês?', function(){
    SENT = {};
    renderReminders();
    scheduleSave();
    showToast('Lembretes resetados.');
  });
}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* ---------- init ---------- */
async function init(){
  await loadState();
  if(SS.length){
    DATE_KEY = dayKey(SS[0]);
    var now = new Date();
    if(pad2(now.getMonth()+1)===MM){
      for(var i=0;i<SS.length;i++){ if(parseInt(SS[i].date)>now.getDate()){ DATE_KEY = dayKey(SS[i]); break; } }
    }
  }
  renderDateBar();
  gTab('rem');
  if(window.claude && window.claude.use){
    window.claude.use('artifact').then(function(ns){ ART = ns; });
  }
}
document.addEventListener('DOMContentLoaded', init);


</script>
